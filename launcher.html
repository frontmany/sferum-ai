<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ассистент Сферум AI</title>
  <!-- Стартовая страница мини-приложения. Этот адрес привязан к боту
       @ideya_fiks_161_bot и не меняется. Куда вести дальше, задаёт config.js:
       меняем там адрес, а не в настройках бота. Параметры адреса и данные
       после # переносятся как есть, чтобы не потерять данные запуска MAX. -->
  <script src="config.js"></script>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #f2efe8; color: #1f3150; }
    @media (prefers-color-scheme: dark) { body { background: #141b27; color: #eef0f3; } }
    p { font-size: 15px; }
  </style>
</head>
<body>
  <p id="msg">Открываем урок…</p>
  <script>
    const target = window.APP_URL;
    if (target) {
      location.replace(target + location.search + location.hash);
    } else {
      document.getElementById("msg").textContent = "Адрес мини-приложения не настроен";
    }
  </script>
</body>
</html>
